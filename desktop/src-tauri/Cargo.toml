[package]
name = "wisdom-desktop"
version = "1.0.1"
description = "Wisdom desktop editor"
authors = ["Wisdom Dev"]
edition = "2021"

[lib]
name = "wisdom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
