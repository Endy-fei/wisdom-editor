name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.0.1). Leave empty to use package.json version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            RAW="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW="${{ github.ref_name }}"
          else
            RAW="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${RAW#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RAW"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (tag v$VERSION)"

  extension:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Publish to Open VSX
        id: ovsx_publish
        if: env.OVSX_PAT != ''
        continue-on-error: true
        run: npx ovsx publish "wisdom-editor-${{ needs.prepare.outputs.version }}.vsix" -p "$OVSX_PAT"

      - name: Warn if Open VSX publish failed
        if: env.OVSX_PAT != '' && steps.ovsx_publish.outcome == 'failure'
        run: echo "::warning::Open VSX publish failed (version may already exist). VSIX artifact is still available."

      - name: Warn if Open VSX secret missing
        if: env.OVSX_PAT == ''
        run: echo "::warning::OVSX_PAT secret is not set; skipped Open VSX publish"

      # PAT 须由「创建 Marketplace 发布者」的同一 Microsoft 帐户签发（Organization=All accessible organizations，Marketplace=Manage）。
      # 若在 Entra「默认目录」下创建的 Azure DevOps 组织签发，会 Access Denied；此处不阻断后续 GitHub Release。
      - name: Publish to VS Marketplace
        id: vsce_publish
        if: env.VSCE_PAT != ''
        continue-on-error: true
        run: npx @vscode/vsce publish --packagePath "wisdom-editor-${{ needs.prepare.outputs.version }}.vsix" -p "$VSCE_PAT"

      - name: Warn if VS Marketplace publish failed
        if: env.VSCE_PAT != '' && steps.vsce_publish.outcome == 'failure'
        run: echo "::warning::VS Marketplace publish failed (check VSCE_PAT identity/scopes). VSIX artifact is still available."

      - name: Warn if VS Marketplace secret missing
        if: env.VSCE_PAT == ''
        run: echo "::warning::VSCE_PAT secret is not set; skipped VS Marketplace publish"

  desktop:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Sync version
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  github-release:
    needs: [prepare, extension, desktop]
    if: ${{ always() && needs.prepare.result == 'success' && needs.extension.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist-release

      - name: Download desktop installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist-release

      - name: List release assets
        run: ls -lah dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Wisdom Editor ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist-release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
